:root{
  color-scheme: light;

  /* Absolutes + warm neutrals */
  --plaud-black:#000000; --plaud-white:#FFFFFF;
  --plaud-warm-dark:#413D3B; --plaud-warm-light:#F2EFEB;
  --plaud-bone:#E8E4DE; --plaud-sand:#D9D3C6;

  /* AI highlights */
  --plaud-amplify:#21EF6A; --plaud-clarity:#00D0FF; --plaud-victory:#8F53ED;
  --grad-ai:linear-gradient(90deg,#21EF6A 0%,#2CA3FF 50%,#8F53ED 100%);

  /* Graphite */
  --plaud-graphite-900:#141414; --plaud-graphite-800:#1F1F1F; --plaud-graphite-700:#2A2A2A;
  --plaud-graphite-500:#6E6E6E; --plaud-graphite-400:#9A9A9A; --plaud-graphite-300:#C7C7C7;
  --plaud-graphite-200:#E1E1E1; --plaud-graphite-100:#F0F0F0;

  /* Signal — RESERVED for blocked / live / destructive */
  --plaud-signal:#FF4A1C;

  /* Semantic */
  --fg-1:var(--plaud-black); --fg-2:var(--plaud-warm-dark);
  --fg-3:var(--plaud-graphite-500); --fg-4:var(--plaud-graphite-400);
  --fg-inverse:var(--plaud-white);
  --bg-1:var(--plaud-white); --bg-2:var(--plaud-warm-light);
  --bg-3:var(--plaud-graphite-100); --bg-4:var(--plaud-bone);
  --bg-inverse:var(--plaud-black);
  --stroke-1:rgba(0,0,0,0.08); --stroke-2:rgba(0,0,0,0.14); --stroke-3:rgba(0,0,0,0.28);

  --status-ok:#2F7D4A; --status-warn:#B8860B; --status-err:#B4321E;

  /* Type */
  --font-brand:"Jokker",ui-sans-serif,system-ui,sans-serif;
  --font-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fw-regular:400; --fw-semibold:600;
  --fs-h1:40px; --fs-h2:32px; --fs-h3:24px; --fs-h4:20px;
  --fs-body-l:18px; --fs-body:16px; --fs-body-s:14px; --fs-caption:12px; --fs-overline:11px;
  --lh-tight:1.05; --lh-snug:1.2; --lh-normal:1.45; --lh-relaxed:1.6;
  --tracking-display:-0.02em; --tracking-tight:-0.01em; --tracking-overline:0.14em;

  /* Space */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;

  /* Radius — Plaud is tight: 5px standard, pill for chips */
  --radius-sm:5px; --radius-pill:999px;

  /* Shadow — restrained */
  --shadow-hairline:0 0 0 1px rgba(0,0,0,0.06);
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04),0 0 0 1px rgba(0,0,0,0.04);
  --shadow-sm:0 2px 6px rgba(0,0,0,0.05),0 0 0 1px rgba(0,0,0,0.04);
  --shadow-md:0 8px 24px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.04);
  --shadow-lg:0 24px 60px rgba(0,0,0,0.12);

  /* Motion — quiet */
  --ease-standard:cubic-bezier(0.22,0.61,0.36,1);
  --dur-fast:120ms; --dur-base:220ms; --dur-slow:420ms;

  /* Confidence hues */
  --conf-confirmed-bg:rgba(33,239,106,0.16);  --conf-confirmed-fg:#0F7A36;
  --conf-likely-bg:rgba(0,208,255,0.14);      --conf-likely-fg:#0B6F89;
  --conf-hypothesis-bg:#FBF1D8;               --conf-hypothesis-fg:#8B6914;
}

/* ---- SECTION 2 · LAYOUT + COMPONENTS ----------------------------------- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg-1);color:var(--fg-1);
  font-family:var(--font-ui);font-weight:var(--fw-regular);line-height:var(--lh-normal);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--plaud-black);color:var(--plaud-white);}
.mono-num{font-variant-numeric:tabular-nums;}
.overline{font-size:var(--fs-overline);letter-spacing:var(--tracking-overline);
  text-transform:uppercase;color:var(--fg-3);font-weight:var(--fw-semibold);}

/* App shell */
#app{display:grid;grid-template-columns:252px 1fr;min-height:100vh;}
@media(max-width:900px){#app{grid-template-columns:1fr;}
  .rail{position:static!important;height:auto!important;border-right:0!important;
    border-bottom:1px solid var(--stroke-1)!important;}}

/* Left rail */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-2);
  border-right:1px solid var(--stroke-1);padding:var(--space-6) var(--space-5) var(--space-8);
  display:flex;flex-direction:column;gap:var(--space-6);}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .wm{font-family:var(--font-brand);font-weight:var(--fw-semibold);
  font-size:19px;letter-spacing:var(--tracking-tight);line-height:1;}
.brand .wm em{font-style:normal;color:var(--fg-3);font-weight:var(--fw-regular);}
.brand .sub{font-size:var(--fs-overline);letter-spacing:0.08em;text-transform:uppercase;
  color:var(--fg-4);font-weight:var(--fw-semibold);}

.rail-sec{display:flex;flex-direction:column;gap:var(--space-2);}
.rail-sec > .overline{margin-bottom:var(--space-1);}

.navitem{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);
  padding:8px 10px;cursor:pointer;transition:background var(--dur-fast) var(--ease-standard);}
.navitem:hover{background:rgba(0,0,0,0.045);}
.navitem[aria-current="true"]{background:var(--plaud-white);border-color:var(--stroke-1);
  box-shadow:var(--shadow-hairline);}
.navitem[aria-current="true"] .nav-label{font-weight:var(--fw-semibold);}
.nav-swatch{width:3px;height:20px;border-radius:2px;flex:0 0 3px;background:var(--fg-4);}
.nav-body{flex:1;min-width:0;}
.nav-label{display:block;font-size:var(--fs-body-s);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-meta{display:block;font-size:10px;color:var(--fg-4);letter-spacing:0.04em;
  font-variant-numeric:tabular-nums;margin-top:1px;}
.nav-count{font-size:var(--fs-caption);color:var(--fg-3);font-variant-numeric:tabular-nums;}

.railbtn{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:transparent;border:1px solid var(--stroke-2);border-radius:var(--radius-sm);
  padding:7px 10px;font-size:var(--fs-caption);cursor:pointer;color:var(--fg-2);
  transition:all var(--dur-fast) var(--ease-standard);}
.railbtn:hover{background:var(--plaud-white);border-color:var(--stroke-3);color:var(--fg-1);}
.railbtn.danger:hover{border-color:var(--plaud-signal);color:var(--plaud-signal);}
.rail-foot{margin-top:auto;font-size:10px;color:var(--fg-4);line-height:1.5;}

/* Main */
.main{min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.78);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--stroke-1);padding:var(--space-4) var(--space-8);
  display:flex;flex-direction:column;gap:var(--space-3);}
.topbar-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;}
.topbar h1{font-family:var(--font-brand);font-weight:var(--fw-regular);font-size:var(--fs-h3);
  letter-spacing:var(--tracking-tight);line-height:var(--lh-snug);margin:0;flex:1;min-width:200px;}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
.stat b{font-size:var(--fs-body-s);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums;}
.stat span{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-4);
  font-weight:var(--fw-semibold);}
.vdiv{width:1px;height:26px;background:var(--stroke-1);}

.search{flex:1;min-width:180px;position:relative;display:flex;align-items:center;}
.search input{width:100%;height:36px;padding:0 var(--space-3) 0 32px;border-radius:var(--radius-sm);
  border:1px solid var(--stroke-2);background:var(--plaud-white);font-size:var(--fs-body-s);
  transition:border-color var(--dur-fast) var(--ease-standard);}
.search input:focus{outline:none;border-color:var(--fg-1);}
.search svg{position:absolute;left:10px;color:var(--fg-4);pointer-events:none;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  height:36px;padding:0 var(--space-4);border-radius:var(--radius-sm);cursor:pointer;
  border:1px solid transparent;font-size:13px;font-weight:var(--fw-semibold);
  white-space:nowrap;transition:all var(--dur-base) var(--ease-standard);}
.btn-primary{background:var(--plaud-black);color:var(--plaud-white);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,0.18);}
.btn-secondary{background:var(--plaud-white);color:var(--fg-1);border-color:var(--stroke-3);}
.btn-secondary:hover{background:var(--bg-2);}
.btn-ghost{background:transparent;color:var(--fg-2);}
.btn-ghost:hover{background:rgba(0,0,0,0.05);color:var(--fg-1);}
.btn-sm{height:30px;padding:0 var(--space-3);font-size:var(--fs-caption);}
.btn-danger{background:transparent;color:var(--plaud-signal);border-color:rgba(255,74,28,0.4);}
.btn-danger:hover{background:rgba(255,74,28,0.06);border-color:var(--plaud-signal);}

/* Filter chips */
.chips{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:var(--radius-pill);border:1px solid var(--stroke-2);background:transparent;
  font-size:var(--fs-caption);color:var(--fg-3);cursor:pointer;
  transition:all var(--dur-fast) var(--ease-standard);}
.chip:hover{border-color:var(--stroke-3);color:var(--fg-1);}
.chip[aria-pressed="true"]{background:var(--plaud-black);border-color:var(--plaud-black);
  color:var(--plaud-white);font-weight:var(--fw-semibold);}
.chip .n{font-variant-numeric:tabular-nums;opacity:0.65;}
.chip-group-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--fg-4);font-weight:var(--fw-semibold);margin-right:2px;}

/* Pills / tags */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
  border-radius:var(--radius-sm);font-size:10px;font-weight:var(--fw-semibold);
  letter-spacing:0.03em;white-space:nowrap;}
.pill .d{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px;}
.pill-confirmed{background:var(--conf-confirmed-bg);color:var(--conf-confirmed-fg);}
.pill-likely{background:var(--conf-likely-bg);color:var(--conf-likely-fg);}
.pill-hypothesis{background:var(--conf-hypothesis-bg);color:var(--conf-hypothesis-fg);}
.pill-neutral{background:var(--bg-3);color:var(--plaud-graphite-700);}
.pill-dark{background:var(--plaud-black);color:var(--plaud-white);}
.pill-blocked{background:rgba(255,74,28,0.1);color:#B4321E;}
.pill-dash{border:1px dashed var(--stroke-2);background:transparent;color:var(--fg-3);}
.pill-p0{background:var(--plaud-black);color:var(--plaud-white);}
.pill-p1{background:var(--bg-4);color:var(--fg-1);}
.pill-p2{background:transparent;color:var(--fg-4);border:1px solid var(--stroke-1);}

/* Content */
.content{padding:var(--space-8) var(--space-8) var(--space-16);
  max-width:1080px;width:100%;}
.area{margin-bottom:var(--space-10);scroll-margin-top:150px;}
.area-head{display:flex;align-items:flex-start;gap:var(--space-4);
  padding-bottom:var(--space-3);border-bottom:1px solid var(--stroke-2);margin-bottom:var(--space-1);}
.area-accent{width:3px;align-self:stretch;border-radius:2px;flex:0 0 3px;margin-top:3px;}
.area-headmain{flex:1;min-width:0;}
.area-title{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;}
.area-title h2{font-family:var(--font-brand);font-weight:var(--fw-regular);font-size:var(--fs-h4);
  letter-spacing:var(--tracking-tight);line-height:var(--lh-snug);margin:0;}
.area-obj{font-size:var(--fs-caption);color:var(--fg-3);margin-top:3px;}
.area-obj b{color:var(--fg-2);font-weight:var(--fw-semibold);}
.area-desc{font-size:var(--fs-body-s);color:var(--fg-2);line-height:var(--lh-relaxed);
  margin:var(--space-3) 0 0;max-width:74ch;}
.area-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
.weight{font-size:var(--fs-body-s);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums;}
.prog{width:120px;height:3px;background:var(--stroke-1);border-radius:2px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--plaud-black);
  transition:width var(--dur-slow) var(--ease-standard);}
.prog-label{font-size:10px;color:var(--fg-4);font-variant-numeric:tabular-nums;
  letter-spacing:0.04em;}

/* Task rows */
.rows{display:flex;flex-direction:column;}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:var(--space-3);align-items:start;
  padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--stroke-1);cursor:pointer;
  transition:background var(--dur-fast) var(--ease-standard);}
.row:hover{background:var(--bg-2);}
.row.is-done .row-title{color:var(--fg-4);text-decoration:line-through;
  text-decoration-color:var(--stroke-2);}
.row-check{width:16px;height:16px;margin-top:3px;border-radius:3px;flex:0 0 16px;
  border:1.5px solid var(--stroke-3);background:transparent;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast) var(--ease-standard);}
.row-check:hover{border-color:var(--fg-1);}
.row-check.on{background:var(--plaud-black);border-color:var(--plaud-black);color:#fff;}
.row-main{min-width:0;}
.row-title{font-size:var(--fs-body-s);line-height:1.4;font-weight:var(--fw-regular);
  color:var(--fg-1);word-break:break-word;}
.row-sub{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:5px;}
.row-metric{font-size:var(--fs-caption);color:var(--fg-3);}
.row-metric b{font-weight:var(--fw-semibold);color:var(--fg-2);}
.row-side{display:flex;align-items:center;gap:var(--space-2);flex:0 0 auto;padding-top:1px;}
.logcount{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--fg-4);
  font-variant-numeric:tabular-nums;}
.due{font-size:var(--fs-caption);color:var(--fg-3);font-variant-numeric:tabular-nums;
  white-space:nowrap;}
.due.overdue{color:var(--plaud-signal);font-weight:var(--fw-semibold);}
.due.soon{color:var(--status-warn);font-weight:var(--fw-semibold);}

.addrow{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-2);}
.addrow input{flex:1;height:34px;border:1px dashed var(--stroke-2);background:transparent;
  border-radius:var(--radius-sm);padding:0 var(--space-3);font-size:var(--fs-body-s);}
.addrow input:focus{outline:none;border-style:solid;border-color:var(--fg-1);
  background:var(--plaud-white);}

.empty{padding:var(--space-6) var(--space-2);font-size:var(--fs-body-s);color:var(--fg-4);}
.blank{padding:var(--space-16) var(--space-8);text-align:center;}
.blank h3{font-family:var(--font-brand);font-weight:var(--fw-regular);margin:0 0 var(--space-2);}
.blank p{font-size:var(--fs-body-s);color:var(--fg-3);margin:0;}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.28);z-index:40;opacity:0;
  pointer-events:none;transition:opacity var(--dur-base) var(--ease-standard);}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;width:min(520px,100vw);height:100vh;z-index:50;
  background:var(--plaud-white);border-left:1px solid var(--stroke-2);box-shadow:var(--shadow-lg);
  transform:translateX(101%);transition:transform var(--dur-base) var(--ease-standard);
  display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:var(--space-5) var(--space-6) var(--space-4);
  border-bottom:1px solid var(--stroke-1);display:flex;align-items:flex-start;gap:var(--space-3);}
.drawer-head .overline{flex:1;padding-top:4px;}
.iconbtn{width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);cursor:pointer;
  color:var(--fg-3);transition:all var(--dur-fast) var(--ease-standard);}
.iconbtn:hover{background:var(--bg-3);color:var(--fg-1);}
.drawer-body{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-6) var(--space-16);}
.drawer-foot{border-top:1px solid var(--stroke-1);padding:var(--space-3) var(--space-6);
  display:flex;align-items:center;gap:var(--space-2);background:var(--bg-2);}
.drawer-foot .spacer{flex:1;}
.saved{font-size:var(--fs-caption);color:var(--status-ok);opacity:0;
  transition:opacity var(--dur-base) var(--ease-standard);}
.saved.on{opacity:1;}

.fset{margin-bottom:var(--space-6);}
.fset > .overline{display:block;padding-bottom:var(--space-2);margin-bottom:var(--space-3);
  border-bottom:1px solid var(--stroke-1);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3) var(--space-4);}
.f{display:flex;flex-direction:column;gap:5px;}
.f.wide{grid-column:1/-1;}
.f label{font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--fg-4);
  font-weight:var(--fw-semibold);}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--stroke-2);
  border-radius:var(--radius-sm);background:var(--plaud-white);padding:7px 10px;
  font-size:var(--fs-body-s);transition:border-color var(--dur-fast) var(--ease-standard);}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--fg-1);}
.f textarea{resize:vertical;min-height:76px;line-height:var(--lh-relaxed);}
.f .hint{font-size:10px;color:var(--fg-4);}
.f-title textarea{font-size:var(--fs-body-l);font-weight:var(--fw-regular);
  letter-spacing:var(--tracking-tight);border-color:transparent;padding:6px 0;min-height:40px;
  line-height:var(--lh-snug);}
.f-title textarea:focus{border-color:transparent;border-bottom:1px solid var(--fg-1);}

/* Links editor */
.linklist{display:flex;flex-direction:column;gap:var(--space-2);}
.linkrow{display:grid;grid-template-columns:100px 1fr auto;gap:var(--space-2);align-items:center;}
.linkrow a{font-size:var(--fs-caption);color:var(--fg-2);border-bottom:1px solid var(--stroke-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;}
.linkrow a:hover{opacity:0.6;}

/* Log (notes / signals) */
.log{display:flex;flex-direction:column;gap:var(--space-2);}
.logentry{background:var(--bg-2);border:1px solid var(--stroke-1);border-radius:var(--radius-sm);
  padding:10px 12px;}
.logentry.sig{background:rgba(0,208,255,0.05);border-color:rgba(0,208,255,0.22);}
.logmeta{display:flex;align-items:center;gap:var(--space-2);margin-bottom:5px;}
.logmeta time{font-size:10px;color:var(--fg-4);letter-spacing:0.04em;
  font-variant-numeric:tabular-nums;}
.logmeta .who{font-size:10px;font-weight:var(--fw-semibold);color:var(--fg-2);}
.logmeta .spacer{flex:1;}
.logbody{font-size:var(--fs-body-s);color:var(--fg-2);line-height:var(--lh-relaxed);
  white-space:pre-wrap;word-break:break-word;}
.logadd{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-2);}
.logadd textarea{min-height:60px;}
.logadd .actions{display:flex;align-items:center;gap:var(--space-2);}
.logadd .actions .spacer{flex:1;}
.del{width:24px;height:24px;flex:0 0 24px;border:0;background:transparent;cursor:pointer;
  color:var(--fg-4);border-radius:3px;display:flex;align-items:center;justify-content:center;}
.del:hover{color:var(--plaud-signal);background:rgba(255,74,28,0.08);}

/* Tags editor */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--stroke-2);
  border-radius:var(--radius-sm);padding:6px 8px;background:var(--plaud-white);min-height:36px;}
.tagbox input{border:0;flex:1;min-width:80px;padding:2px 0;font-size:var(--fs-caption);}
.tagbox input:focus{outline:none;}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;
  border-radius:3px;background:var(--bg-3);font-size:10px;color:var(--fg-2);
  font-weight:var(--fw-semibold);}
.tag button{border:0;background:transparent;cursor:pointer;color:var(--fg-4);padding:0;
  font-size:12px;line-height:1;}
.tag button:hover{color:var(--plaud-signal);}

/* Toast */
.toast{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--plaud-black);color:var(--plaud-white);padding:10px 16px;
  border-radius:var(--radius-sm);font-size:var(--fs-caption);font-weight:var(--fw-semibold);
  z-index:90;opacity:0;pointer-events:none;box-shadow:var(--shadow-md);
  transition:all var(--dur-base) var(--ease-standard);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Reveal */
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.area{animation:rise var(--dur-slow) var(--ease-standard) both;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="brand">
      <div class="wm">PLAUD <em>· Community Ops</em></div>
      <div class="sub">H2 2026 Direction Tracker</div>
    </div>

    <div class="rail-sec">
      <span class="overline">Areas</span>
      <div id="nav"></div>
    </div>

    <div class="rail-sec">
      <span class="overline">Data</span>
      <button class="railbtn" data-act="export">Export JSON<span>&#8595;</span></button>
      <button class="railbtn" data-act="import">Import JSON<span>&#8593;</span></button>
      <button class="railbtn" data-act="markdown">Copy as Markdown<span>&#9633;</span></button>
      <button class="railbtn danger" data-act="reset">Reset to seed<span>&#8635;</span></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>

    <div class="rail-foot">
      Local to this device. Export regularly.<br>
      <span id="meta"></span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-row">
        <h1 id="viewtitle">All areas</h1>
        <div class="stat"><b id="s-open" class="mono-num">0</b><span>Open</span></div>
        <div class="vdiv"></div>
        <div class="stat"><b id="s-done" class="mono-num">0</b><span>Done</span></div>
        <div class="vdiv"></div>
        <div class="stat"><b id="s-log" class="mono-num">0</b><span>Log entries</span></div>
        <button class="btn btn-primary" data-act="new">+ Task</button>
      </div>
      <div class="topbar-row">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-4.2-4.2"/></svg>
          <input id="q" type="search" placeholder="Search titles, notes, signals, tags…">
        </div>
        <div class="chips" id="filters"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="overline" id="drawer-eyebrow">Task</span>
    <button class="iconbtn" data-act="dup" title="Duplicate">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <path d="M5 15V5a2 2 0 012-2h10"/></svg></button>
    <button class="iconbtn" data-act="close" title="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <span class="saved" id="saved">Saved</span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-danger" data-act="delete">Delete</button>
    <button class="btn btn-sm btn-secondary" data-act="close">Done</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   SECTION 3 · SCHEMA
   --------------------------------------------------------------------------
   Everything the UI knows about a task lives here. To add a field:
     1. add an entry to FIELDS (pick a `type` that RENDERERS knows)
     2. add a default in makeTask()
     3. bump STORE.VERSION and add a migration step
   No other file/section needs to change.
   ======================================================================== */

const AREAS = [
  { id:'builder-community', short:'Builder Community',
    name:'Growing the Builder Community', accent:'#21EF6A',
    confidence:'confirmed', weight:'~40%',
    objective:'Grow & Engage Builder Community',
    desc:'Tracks closely with what you were already doing before you started — engaging in the Builder Discord, tracking competitive and industry signal. Lean into that: help the Discord become a place where builders actually produce things (workflows, templates, skills), not just a bigger member count.' },
  { id:'team-support', short:'Team Support',
    name:'Supporting the Team, Upstream & Downstream', accent:'#2CA3FF',
    confidence:'confirmed', weight:'~35%',
    objective:'Supporting Downstream & Upstream',
    desc:'The natural extension of the Week 1 notes — flagging UGC to Claire, and eventually low-stakes replies with Jun Lin’s review. Over time: catching signal in channels neither of them has bandwidth to monitor, and routing it to whichever of them it serves.' },
  { id:'sigma', short:'Sigma Ecosystem',
    name:'Sigma Builder Ecosystem', accent:'#8F53ED',
    confidence:'likely', weight:'tbd',
    objective:'Sigma Builder Ecosystem',
    desc:'Probably the longer-term center of gravity, but still forming. Higher confidence: shadowing and eventually helping run the Sigma white-glove support playbook through Alpha and Beta. Less settled: whether standout-contributor identification becomes a formal ambassador track or stays a loose list.' },
  { id:'o2o', short:'Offline-to-Online',
    name:'Offline-to-Online (O2O)', accent:'#B8860B',
    confidence:'hypothesis', weight:'tbd',
    objective:'Offline-to-Online (O2O)',
    desc:'The least settled of the four. A possible pilot, not a committed program — testing whether there’s a real bridge between Plaud’s offline presence (events, roadshows) and the online communities, in both directions. Go/no-go still open.' },
  { id:'reflection', short:'Questions to sit with',
    name:'Questions to Sit With', accent:'#413D3B',
    confidence:null, weight:null,

    links:[], signals:[], notes:[],

}

/* ==========================================================================
   SECTION 4 · STORE — persistence, versioning, migration, import/export
   ======================================================================== */
const STORE = {
  KEY: 'plaud.h2tracker',
  VERSION: 1,

  /* Migrations run in order. Each takes the whole doc and returns it upgraded.
     Add `2: doc => {...}` when you bump VERSION to 2 — existing data survives. */
  migrations: {
    // 1: doc => doc,
  },

  fresh() {
    return { version: STORE.VERSION, createdAt: nowISO(), updatedAt: nowISO(),
             source: 'pinyan-h2-direction-thought-starter.html', tasks: seed() };
  },

  load() {
    let doc = null;
    try { const raw = localStorage.getItem(STORE.KEY); if (raw) doc = JSON.parse(raw); }
    catch (e) { console.warn('load failed, starting fresh', e); }
    if (!doc || !Array.isArray(doc.tasks)) doc = STORE.fresh();
    return STORE.normalize(doc);
  },

  normalize(doc) {
    let v = doc.version || 0;
    while (v < STORE.VERSION) { v++; const m = STORE.migrations[v]; if (m) doc = m(doc); doc.version = v; }
    /* Field-level backfill: any field added to FIELDS/makeTask gets a default
       on old records without needing a migration. */
    const proto = makeTask();
    doc.tasks = doc.tasks.map(t => {
      const out = Object.assign({}, proto, t);
      out.id = t.id || uid();
      ['tags','links','signals','notes'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
      if (!vocab('status', out.status)) out.status = 'backlog';
      if (!vocab('priority', out.priority)) out.priority = 'p1';
      if (out.confidence && !vocab('confidence', out.confidence)) out.confidence = 'likely';
      if (!areaOf(out.area) || !AREAS.some(a => a.id === out.area)) out.area = AREAS[0].id;
      out.progress = Math.max(0, Math.min(100, Number(out.progress) || 0));
      return out;
    });
    return doc;
  },

  save(doc) {
    doc.updatedAt = nowISO();
    try { localStorage.setItem(STORE.KEY, JSON.stringify(doc)); }
    catch (e) { toast('Could not save — storage full?'); console.error(e); }
  },

  export(doc) {
    const blob = new Blob([JSON.stringify(doc, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'plaud-h2-tracker-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  import(text) {
    const incoming = JSON.parse(text);
    if (!incoming || !Array.isArray(incoming.tasks)) throw new Error('No tasks array in file');
    return STORE.normalize(incoming);
  },
};

/* ==========================================================================
   SECTION 5 · STATE + SELECTORS
   ======================================================================== */
let doc = STORE.load();
const ui = { area:'all', q:'', filters:{ status:new Set(), priority:new Set(), confidence:new Set() },
             openId:null, hideDone:false };

const isDone = t => { const s = vocab('status', t.status); return !!(s && s.done); };

function haystack(t) {
  const parts = [t.title, t.detail, t.owner, t.objective, t.metric, t.target, t.current];
  (t.tags || []).forEach(x => parts.push(x));
  (t.links || []).forEach(l => { parts.push(l.label, l.url); });
  (t.notes || []).concat(t.signals || []).forEach(n => parts.push(n.body));
  return parts.filter(Boolean).join(' · ').toLowerCase();
}

function visible() {
  const q = ui.q.trim().toLowerCase();
  const f = ui.filters;
  return doc.tasks.filter(t => {
    if (t.archived) return false;
    if (ui.area !== 'all' && t.area !== ui.area) return false;
    if (ui.hideDone && isDone(t)) return false;
    if (f.status.size && !f.status.has(t.status)) return false;
    if (f.priority.size && !f.priority.has(t.priority)) return false;
    if (f.confidence.size && !f.confidence.has(t.confidence)) return false;
    if (q && !haystack(t).includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const ad = isDone(a) ? 1 : 0, bd = isDone(b) ? 1 : 0;
    if (ad !== bd) return ad - bd;
    if (a.priority !== b.priority) return a.priority.localeCompare(b.priority);
    return (a.order || 0) - (b.order || 0);
  });
}

function rollup(areaId) {
  const ts = doc.tasks.filter(t => !t.archived && t.area === areaId);
  const done = ts.filter(isDone).length;
  const explicit = ts.filter(t => Number(t.progress) > 0);
  const pct = ts.length === 0 ? 0
    : Math.round(explicit.length
        ? ts.reduce((s, t) => s + (isDone(t) ? 100 : Number(t.progress) || 0), 0) / ts.length
        : (done / ts.length) * 100);
  const logs = ts.reduce((s, t) => s + (t.notes || []).length + (t.signals || []).length, 0);
  return { total: ts.length, done, open: ts.length - done, pct, logs };
}

/* ==========================================================================
   SECTION 6 · RENDER
   ======================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function fmtStamp(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' · ' +
         d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
function dueClass(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T23:59:59'); if (isNaN(d)) return '';
  const days = (d - Date.now()) / 86400000;
  return days < 0 ? 'overdue' : days < 4 ? 'soon' : '';
}
function pill(kind, id) {
  const o = vocab(kind, id); if (!o) return '';
  return '<span class="pill ' + o.pill + '">' + esc(o.label) + '</span>';
}

function renderNav() {
  const all = { total:0, done:0, open:0, logs:0 };
  AREAS.forEach(a => { const r = rollup(a.id);
    all.total += r.total; all.done += r.done; all.open += r.open; all.logs += r.logs; });

  let h = '<button class="navitem" data-area="all" aria-current="' + (ui.area === 'all') + '">' +
    '<span class="nav-swatch" style="background:#000"></span>' +
    '<span class="nav-body"><span class="nav-label">All areas</span>' +
    '<span class="nav-meta">' + all.done + ' / ' + all.total + ' done</span></span>' +
    '<span class="nav-count">' + all.open + '</span></button>';

  h += AREAS.map(a => {
    const r = rollup(a.id);
    return '<button class="navitem" data-area="' + a.id + '" aria-current="' + (ui.area === a.id) + '">' +
      '<span class="nav-swatch" style="background:' + a.accent + '"></span>' +
      '<span class="nav-body"><span class="nav-label">' + esc(a.short) + '</span>' +
      '<span class="nav-meta">' + (a.weight ? esc(a.weight) + ' · ' : '') + r.pct + '%</span></span>' +
      '<span class="nav-count">' + r.open + '</span></button>';
  }).join('');

  $('#nav').innerHTML = h;
  $('#s-open').textContent = all.open;
  $('#s-done').textContent = all.done;
  $('#s-log').textContent = all.logs;
  $('#meta').textContent = 'v' + doc.version + ' · updated ' + fmtStamp(doc.updatedAt);
  $('#viewtitle').textContent = ui.area === 'all' ? 'All areas' : areaOf(ui.area).name;
}

function renderFilters() {
  const counts = k => {
    const m = {};
    doc.tasks.forEach(t => { if (t.archived) return;
      if (ui.area !== 'all' && t.area !== ui.area) return;
      m[t[k]] = (m[t[k]] || 0) + 1; });
    return m;
  };
  let h = '';
  [['status','Status'],['priority','Priority'],['confidence','Confidence']].forEach(([k, label]) => {
    const c = counts(k);
    h += '<span class="chip-group-label">' + label + '</span>';
    h += VOCAB[k].map(o =>
      '<button class="chip" data-filter="' + k + '" data-val="' + o.id + '" aria-pressed="' +
      ui.filters[k].has(o.id) + '">' + esc(o.label) +
      '<span class="n">' + (c[o.id] || 0) + '</span></button>').join('');
  });
  h += '<span class="vdiv"></span>' +
       '<button class="chip" data-act="hidedone" aria-pressed="' + ui.hideDone + '">Hide done</button>';
  const active = ui.q || ui.hideDone ||
    Object.values(ui.filters).some(s => s.size);
  if (active) h += '<button class="chip" data-act="clear">Clear ×</button>';
  $('#filters').innerHTML = h;
}

function renderRow(t) {
  const a = areaOf(t.area);
  const notes = (t.notes || []).length, sigs = (t.signals || []).length,
        links = (t.links || []).length;
  let sub = '';
  if (t.confidence && t.area !== 'reflection') sub += pill('confidence', t.confidence);
  sub += pill('status', t.status);
  if (t.priority !== 'p1') sub += pill('priority', t.priority);
  (t.tags || []).forEach(x => { sub += '<span class="pill pill-neutral">' + esc(x) + '</span>'; });
  if (t.metric) sub += '<span class="row-metric"><b>' + esc(t.metric) + '</b>' +
    (t.target ? ' → ' + esc(t.target) : '') + '</span>';
  if (ui.area === 'all') sub = '<span class="pill pill-neutral">' + esc(a.short) + '</span>' + sub;

  let side = '';
  if (sigs)  side += '<span class="logcount" title="Signal entries">◇ ' + sigs + '</span>';
  if (notes) side += '<span class="logcount" title="Notes">✎ ' + notes + '</span>';
  if (links) side += '<span class="logcount" title="Links">↗ ' + links + '</span>';
  if (t.progress > 0 && !isDone(t))
    side += '<span class="logcount mono-num">' + t.progress + '%</span>';
  if (t.due) side += '<span class="due ' + dueClass(t.due) + '">' + fmtDate(t.due) + '</span>';

  return '<div class="row' + (isDone(t) ? ' is-done' : '') + '" data-id="' + t.id + '">' +
    '<button class="row-check' + (isDone(t) ? ' on' : '') + '" data-act="toggle" data-id="' + t.id +
      '" aria-label="Toggle done">' +
      (isDone(t) ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>' : '') +
    '</button>' +
    '<div class="row-main"><div class="row-title">' + (esc(t.title) || '<i>Untitled</i>') + '</div>' +
    (sub ? '<div class="row-sub">' + sub + '</div>' : '') + '</div>' +
    '<div class="row-side">' + side + '</div></div>';
}

function renderContent() {
  const rows = visible();
  const groups = ui.area === 'all' ? AREAS : [areaOf(ui.area)];
  if (!rows.length && (ui.q || Object.values(ui.filters).some(s => s.size))) {
    $('#content').innerHTML = '<div class="blank"><h3>Nothing matches.</h3>' +
      '<p>Loosen the filters or clear the search.</p></div>';
    return;
  }
  $('#content').innerHTML = groups.map((a, i) => {
    const r = rollup(a.id);
    const mine = rows.filter(t => t.area === a.id);
    let head = '<div class="area-head"><span class="area-accent" style="background:' + a.accent + '"></span>' +
      '<div class="area-headmain"><div class="area-title"><h2>' + esc(a.name) + '</h2>' +
      (a.confidence ? pill('confidence', a.confidence) : '') + '</div>' +
      (a.objective ? '<div class="area-obj">Objective · <b>' + esc(a.objective) + '</b></div>' : '') +
      '</div>' +
      '<div class="area-right">' +
      (a.weight ? '<span class="weight">' + esc(a.weight) + '</span>' : '') +
      '<span class="prog"><i style="width:' + r.pct + '%"></i></span>' +
      '<span class="prog-label">' + r.done + '/' + r.total + ' · ' + r.pct + '%</span>' +
      '</div></div>';
    let body = '<p class="area-desc">' + esc(a.desc) + '</p>';
    body += '<div class="rows">' + (mine.length ? mine.map(renderRow).join('')
      : '<div class="empty">No tasks here yet.</div>') + '</div>';
    body += '<div class="addrow"><input data-addarea="' + a.id +
      '" placeholder="Add a task to ' + esc(a.short) + ' — press Enter"></div>';
    return '<section class="area" id="area-' + a.id +
      '" style="animation-delay:' + (i * 50) + 'ms">' + head + body + '</section>';
  }).join('');
}

/* ---- Drawer: field renderers -------------------------------------------
   Each `type` in FIELDS maps to one function here. Adding a new input type
   means adding one entry — nothing else changes.                          */
const RENDERERS = {
  title: (f, t) => '<div class="f wide f-title"><label>' + f.label + '</label>' +
    '<textarea data-field="title" rows="2" placeholder="What is this?">' + esc(t.title) + '</textarea></div>',

  text: (f, t) => wrap(f, '<input data-field="' + f.key + '" value="' + esc(t[f.key]) + '">'),

  number: (f, t) => wrap(f, '<input type="number" data-field="' + f.key + '" value="' +
    esc(t[f.key]) + '" min="' + (f.min ?? '') + '" max="' + (f.max ?? '') + '" step="' + (f.step ?? 1) + '">'),

  date: (f, t) => wrap(f, '<input type="date" data-field="' + f.key + '" value="' + esc(t[f.key]) + '">'),

  textarea: (f, t) => wrap(f, '<textarea data-field="' + f.key + '" rows="4">' + esc(t[f.key]) + '</textarea>'),

  select: (f, t) => {
    const opts = f.opts === 'areas'
      ? AREAS.map(a => ({ id:a.id, label:a.short }))
      : VOCAB[f.opts] || [];
    return wrap(f, '<select data-field="' + f.key + '">' + opts.map(o =>
      '<option value="' + o.id + '"' + (t[f.key] === o.id ? ' selected' : '') + '>' +
      esc(o.label) + '</option>').join('') + '</select>');
  },

  tags: (f, t) => wrap(f, '<div class="tagbox" data-tagbox="' + f.key + '">' +
    (t[f.key] || []).map((x, i) => '<span class="tag">' + esc(x) +
      '<button data-act="untag" data-field="' + f.key + '" data-i="' + i + '">×</button></span>').join('') +
    '<input data-tagadd="' + f.key + '" placeholder="add tag + Enter"></div>'),

  links: (f, t) => wrap(f, '<div class="linklist">' +
    (t[f.key] || []).map((l, i) =>
      '<div class="linkrow"><input data-linkfield="label" data-i="' + i + '" value="' + esc(l.label) +
      '" placeholder="Label"><input data-linkfield="url" data-i="' + i + '" value="' + esc(l.url) +
      '" placeholder="https://…"><button class="del" data-act="unlink" data-i="' + i + '">×</button></div>'
    ).join('') +
    '<button class="btn btn-sm btn-secondary" data-act="addlink" style="align-self:flex-start">+ Link</button>' +
    '</div>'),

  log: (f, t) => {
    const entries = (t[f.key] || []).slice().sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
    return wrap(f, '<div class="log">' +
      (entries.length ? entries.map(e =>
        '<div class="logentry' + (f.variant === 'sig' ? ' sig' : '') + '">' +
        '<div class="logmeta"><span class="who">' + esc(e.author || 'Yesly') + '</span>' +
        '<time>' + fmtStamp(e.ts) + '</time><span class="spacer"></span>' +
        '<button class="del" data-act="unlog" data-field="' + f.key + '" data-eid="' + e.id + '">×</button></div>' +
        '<div class="logbody">' + esc(e.body) + '</div></div>').join('')
        : '<div class="empty" style="padding:0 0 4px">Nothing logged yet.</div>') +
      '<div class="logadd"><textarea data-logadd="' + f.key + '" rows="2" placeholder="' +
      (f.variant === 'sig' ? 'What did you observe?' : 'What happened / what changed?') +
      '"></textarea><div class="actions"><span class="hint" style="font-size:10px;color:var(--fg-4)">' +
      '⌘/Ctrl + Enter to add</span><span class="spacer"></span>' +
      '<button class="btn btn-sm btn-primary" data-act="addlog" data-field="' + f.key + '">Add entry</button>' +
      '</div></div></div>');
  },
};
function wrap(f, inner) {
  return '<div class="f' + (f.wide ? ' wide' : '') + '"><label>' + esc(f.label) + '</label>' + inner +
    (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + '</div>';
}

function renderDrawer() {
  const t = doc.tasks.find(x => x.id === ui.openId);
  const d = $('#drawer'), sc = $('#scrim');
  if (!t) { d.classList.remove('open'); d.setAttribute('aria-hidden','true'); sc.classList.remove('open'); return; }
  d.classList.add('open'); d.setAttribute('aria-hidden','false'); sc.classList.add('open');
  $('#drawer-eyebrow').textContent = areaOf(t.area).short + ' · ' + fmtStamp(t.updatedAt);
  $('#drawer-body').innerHTML = GROUPS.map(g => {
    const fs = FIELDS.filter(f => f.group === g.id);
    if (!fs.length) return '';
    return '<div class="fset"><span class="overline">' + esc(g.label) + '</span>' +
      '<div class="fgrid">' + fs.map(f => (RENDERERS[f.type] || RENDERERS.text)(f, t)).join('') +
      '</div></div>';
  }).join('');
}

function render() { renderNav(); renderFilters(); renderContent(); renderDrawer(); }

/* ==========================================================================
   SECTION 7 · CONTROLLER
   ======================================================================== */
function commit(rerenderDrawer = true) {
  STORE.save(doc);
  renderNav(); renderFilters(); renderContent();
  if (rerenderDrawer) renderDrawer();
  flashSaved();
}
let savedT;
function flashSaved() {
  const el = $('#saved'); if (!el) return;
  el.classList.add('on'); clearTimeout(savedT);
  savedT = setTimeout(() => el.classList.remove('on'), 1100);
}
let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200);
}
const current = () => doc.tasks.find(x => x.id === ui.openId);
function touch(t) { t.updatedAt = nowISO(); }

function openTask(id) { ui.openId = id; renderDrawer(); }
function closeTask() { ui.openId = null; renderDrawer(); }

function addTask(areaId, title) {
  const maxOrder = doc.tasks.reduce((m, t) => Math.max(m, t.order || 0), 0);
  const a = areaOf(areaId);
  const t = makeTask({ area: areaId, title: title || '',
    confidence: a.confidence || 'likely',
    objective: a.objective || '', weight: a.weight || '', order: maxOrder + 1 });
  doc.tasks.push(t);
  STORE.save(doc); renderNav(); renderFilters(); renderContent();
  return t;
}

/* --- global click routing --- */
document.addEventListener('click', e => {
  const nav = e.target.closest('.navitem');
  if (nav) { ui.area = nav.dataset.area; render();
    window.scrollTo({ top:0, behavior:'smooth' }); return; }

  const chip = e.target.closest('.chip');
  if (chip) {
    if (chip.dataset.filter) {
      const s = ui.filters[chip.dataset.filter];
      s.has(chip.dataset.val) ? s.delete(chip.dataset.val) : s.add(chip.dataset.val);
    } else if (chip.dataset.act === 'hidedone') { ui.hideDone = !ui.hideDone; }
    else if (chip.dataset.act === 'clear') {
      ui.q = ''; $('#q').value = ''; ui.hideDone = false;
      Object.values(ui.filters).forEach(s => s.clear());
    }
    renderFilters(); renderContent(); return;
  }

  const btn = e.target.closest('[data-act]');
  const act = btn && btn.dataset.act;

  if (act === 'toggle') {
    e.stopPropagation();
    const t = doc.tasks.find(x => x.id === btn.dataset.id); if (!t) return;
    if (isDone(t)) { t.status = 'active'; }
    else { t.status = 'done'; if (Number(t.progress) < 100) t.progress = 100; }
    touch(t); commit(); return;
  }

  if (!act) {
    const row = e.target.closest('.row');
    if (row) { openTask(row.dataset.id); return; }
  }

  switch (act) {
    case 'new': {
      const t = addTask(ui.area === 'all' ? AREAS[0].id : ui.area, '');
      openTask(t.id);
      setTimeout(() => { const el = $('#drawer-body [data-field="title"]'); if (el) el.focus(); }, 260);
      return;
    }
    case 'close': closeTask(); return;
    case 'delete': {
      const t = current(); if (!t) return;
      if (!confirm('Delete "' + (t.title || 'Untitled') + '"? This cannot be undone.')) return;
      doc.tasks = doc.tasks.filter(x => x.id !== t.id);
      ui.openId = null; commit(); toast('Deleted'); return;
    }
    case 'dup': {
      const t = current(); if (!t) return;
      const copy = JSON.parse(JSON.stringify(t));
      copy.id = uid(); copy.title = t.title + ' (copy)';
      copy.createdAt = copy.updatedAt = nowISO();
      copy.order = (t.order || 0) + 0.5;
      doc.tasks.push(copy); openTask(copy.id); commit(); toast('Duplicated'); return;
    }
    case 'export': STORE.export(doc); toast('Exported'); return;
    case 'import': $('#file').click(); return;
    case 'markdown': copyMarkdown(); return;
    case 'reset': {
      if (!confirm('Replace everything with the original seed from the thought starter?\n\nExport first if you want a backup.')) return;
      doc = STORE.fresh(); ui.openId = null; commit(); toast('Reset to seed'); return;
    }
    case 'addlink': {
      const t = current(); if (!t) return;
      t.links.push({ label:'', url:'' }); touch(t); commit(); return;
    }
    case 'unlink': {
      const t = current(); if (!t) return;
      t.links.splice(Number(btn.dataset.i), 1); touch(t); commit(); return;
    }
    case 'untag': {
      const t = current(); if (!t) return;
      t[btn.dataset.field].splice(Number(btn.dataset.i), 1); touch(t); commit(); return;
    }
    case 'addlog': {
      const t = current(); if (!t) return;
      const k = btn.dataset.field;
      const ta = $('#drawer-body [data-logadd="' + k + '"]');
      pushLog(t, k, ta && ta.value); return;
    }
    case 'unlog': {
      const t = current(); if (!t) return;
      const k = btn.dataset.field;
      t[k] = t[k].filter(x => x.id !== btn.dataset.eid); touch(t); commit(); return;
    }
  }
});

function pushLog(t, key, body) {
  const v = (body || '').trim(); if (!v) return;
  t[key].push({ id:uid(), ts:nowISO(), author:'Yesly', body:v });
  touch(t); commit(); toast(key === 'signals' ? 'Signal logged' : 'Note added');
}

/* --- field edits (live, debounced save) --- */
let saveT;
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(() => {
  STORE.save(doc); renderNav(); renderContent(); flashSaved(); }, 350); }

document.addEventListener('input', e => {
  const el = e.target;

  if (el.id === 'q') { ui.q = el.value; renderContent(); return; }

  const t = current(); if (!t || !el.closest('#drawer-body')) return;

  if (el.dataset.field) {
    const f = FIELDS.find(x => x.key === el.dataset.field);
    let v = el.value;
    if (f && f.type === 'number') v = Math.max(f.min ?? 0, Math.min(f.max ?? 1e9, Number(v) || 0));
    t[el.dataset.field] = v;
    if (el.dataset.field === 'status' || el.dataset.field === 'area') {
      touch(t); STORE.save(doc); render(); return;
    }
    touch(t); scheduleSave(); return;
  }

  if (el.dataset.linkfield) {
    const i = Number(el.dataset.i);
    if (t.links[i]) { t.links[i][el.dataset.linkfield] = el.value; touch(t); scheduleSave(); }
    return;
  }
});

/* --- keyboard --- */
document.addEventListener('keydown', e => {
  const el = e.target;

  if (el.dataset && el.dataset.addarea && e.key === 'Enter') {
    e.preventDefault();
    const v = el.value.trim(); if (!v) return;
    addTask(el.dataset.addarea, v);
    el.value = ''; toast('Added');
    setTimeout(() => { const again = document.querySelector('[data-addarea="' + el.dataset.addarea + '"]');
      if (again) again.focus(); }, 0);
    return;
  }

  if (el.dataset && el.dataset.tagadd && e.key === 'Enter') {
    e.preventDefault();
    const t = current(); if (!t) return;
    const v = el.value.trim(); if (!v) return;
    const k = el.dataset.tagadd;
    if (!t[k].includes(v)) t[k].push(v);
    touch(t); commit(); return;
  }

  if (el.dataset && el.dataset.logadd && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    const t = current(); if (!t) return;
    pushLog(t, el.dataset.logadd, el.value); return;
  }

  if (e.key === 'Escape') { if (ui.openId) closeTask(); else if (ui.q) { ui.q=''; $('#q').value=''; renderContent(); } return; }

  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  if (!typing && (e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    const t = addTask(ui.area === 'all' ? AREAS[0].id : ui.area, '');
    openTask(t.id);
    setTimeout(() => { const f = $('#drawer-body [data-field="title"]'); if (f) f.focus(); }, 260);
  }
  if (!typing && e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

$('#scrim').addEventListener('click', closeTask);

/* --- import --- */
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { doc = STORE.import(r.result); ui.openId = null; commit(); toast('Imported ' + doc.tasks.length + ' tasks'); }
    catch (err) { toast('Import failed: ' + err.message); console.error(err); }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* --- markdown export --- */
function copyMarkdown() {
  const L = ['# Plaud · H2 2026 Direction Tracker', '',
    '_Exported ' + new Date().toLocaleString() + '_', ''];
  AREAS.forEach(a => {
    const ts = doc.tasks.filter(t => !t.archived && t.area === a.id);
    if (!ts.length) return;
    const r = rollup(a.id);
    L.push('## ' + a.name + (a.weight ? '  ·  ' + a.weight : '') +
      (a.confidence ? '  ·  ' + vocab('confidence', a.confidence).label : ''));
    L.push('`' + r.done + '/' + r.total + ' done · ' + r.pct + '%`', '');
    ts.sort((x, y) => (x.order || 0) - (y.order || 0)).forEach(t => {
      const bits = [vocab('status', t.status).label];
      if (t.priority !== 'p1') bits.push(vocab('priority', t.priority).label);
      if (t.confidence && a.id !== 'reflection') bits.push(vocab('confidence', t.confidence).label);
      if (t.due) bits.push('due ' + t.due);
      L.push('- [' + (isDone(t) ? 'x' : ' ') + '] **' + (t.title || 'Untitled') + '**  — _' + bits.join(' · ') + '_');
      if (t.detail) L.push('  - ' + t.detail.replace(/\n/g, ' '));
      if (t.metric) L.push('  - Metric: ' + t.metric + (t.target ? ' → ' + t.target : '') +
        (t.current ? ' (now: ' + t.current + ')' : ''));
      (t.links || []).filter(l => l.url).forEach(l => L.push('  - [' + (l.label || l.url) + '](' + l.url + ')'));
      (t.signals || []).forEach(s => L.push('  - ◇ ' + s.ts.slice(0,10) + ' — ' + s.body.replace(/\n/g,' ')));
      (t.notes || []).forEach(n => L.push('  - ✎ ' + n.ts.slice(0,10) + ' — ' + n.body.replace(/\n/g,' ')));
    });
    L.push('');
  });
  const md = L.join('\n');
  const done = () => toast('Markdown copied');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(done).catch(() => fallbackCopy(md, done));
  } else fallbackCopy(md, done);
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('Copy blocked — use Export JSON'); }
  document.body.removeChild(ta);
}

/* --- boot --- */
render();
console.log('[tracker] booted · v' + doc.version + ' · ' + doc.tasks.length + ' tasks · ' +
  AREAS.length + ' areas · ' + FIELDS.length + ' fields');
</script>
</body>
</html>
