:root{
  --font:"Jokker",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fw-reg:400;--fw-sb:600;
  --paper:#FFFFFF;--panel:#FAFAF8;--card:#FFFFFF;--warm:#F2EFEB;
  --ink-1:#000000;--ink-2:#413D3B;--ink-3:#6E6E6E;--ink-4:#9A9A9A;
  --stroke-1:rgba(0,0,0,.06);--stroke-2:rgba(0,0,0,.10);--stroke-3:rgba(0,0,0,.22);
  --hover:rgba(0,0,0,.05);
  --signal:#FF4A1C;--amplify:#21EF6A;--clarity:#00D0FF;--victory:#8F53ED;
  --grad-ai:linear-gradient(90deg,#21EF6A 0%,#2CA3FF 50%,#8F53ED 100%);
  --r:5px;--r-lg:10px;--pill:999px;
  --ease:cubic-bezier(0.22,0.61,0.36,1);--dur:180ms;
  --focus:#000;
}
:root[data-theme="dark"]{
  --paper:#141414;--panel:#191919;--card:#1F1F1F;--warm:#232323;
  --ink-1:#FFFFFF;--ink-2:#C7C7C7;--ink-3:#9A9A9A;--ink-4:#6E6E6E;
  --stroke-1:rgba(255,255,255,.07);--stroke-2:rgba(255,255,255,.11);--stroke-3:rgba(255,255,255,.24);
  --hover:rgba(255,255,255,.06);--focus:#FFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141414;--panel:#191919;--card:#1F1F1F;--warm:#232323;
  --ink-1:#FFFFFF;--ink-2:#C7C7C7;--ink-3:#9A9A9A;--ink-4:#6E6E6E;
  --stroke-1:rgba(255,255,255,.07);--stroke-2:rgba(255,255,255,.11);--stroke-3:rgba(255,255,255,.24);
  --hover:rgba(255,255,255,.06);--focus:#FFF;
}}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--paper);color:var(--ink-1);font-family:var(--font);font-weight:var(--fw-reg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.45;}
::selection{background:var(--ink-1);color:var(--paper);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
button{font-family:inherit;}
.tnum{font-variant-numeric:tabular-nums;}
.ovl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:var(--fw-sb);color:var(--ink-3);}
svg{display:block;}

/* ---- app shell ---- */
.app{display:flex;min-height:100vh;}
.sidebar{width:244px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--stroke-1);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 10px;display:flex;flex-direction:column;gap:4px;}
.main{flex:1;min-width:0;}
.mainwrap{max-width:900px;margin:0 auto;padding:34px 40px 80px;}

/* ---- sidebar ---- */
.sb-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;}
.light-only{display:block;} .dark-only{display:none;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dark-only{display:block;} :root:not([data-theme="light"]) .light-only{display:none;}}
:root[data-theme="dark"] .dark-only{display:block;} :root[data-theme="dark"] .light-only{display:none;}
:root[data-theme="light"] .light-only{display:block;} :root[data-theme="light"] .dark-only{display:none;}
.brand-logo{height:18px;width:auto;}
.sb-acct{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);margin-bottom:6px;}
.sb-avatar{width:22px;height:22px;border-radius:5px;background:var(--ink-1);color:var(--paper);font-size:11px;font-weight:var(--fw-sb);display:flex;align-items:center;justify-content:center;}
.sb-acct .n{font-size:12.5px;color:var(--ink-1);}
.sb-acct .r{font-size:11px;color:var(--ink-3);margin-left:auto;}
.sb-head{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:var(--fw-sb);padding:12px 8px 5px;}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r);background:transparent;border:none;color:var(--ink-2);cursor:pointer;font-size:12.5px;text-align:left;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.sb-item:hover{background:var(--hover);}
.sb-item.active{background:var(--hover);color:var(--ink-1);font-weight:500;}
.sb-item .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-item .cnt{font-size:11px;color:var(--ink-3);}
.sb-item .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-week{align-items:flex-start;}
.sb-week .wlab{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.sb-week .l1{display:flex;align-items:center;gap:7px;}
.sb-week .l2{font-size:10.5px;color:var(--ink-4);letter-spacing:.02em;}
.sb-week .phdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ph-current{background:var(--signal);} .ph-past{background:var(--ink-4);} .ph-upcoming{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-4);}
.sb-week .cnt{margin-top:1px;}

/* progression tag */
.ptag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:var(--fw-sb);padding:2px 8px;border-radius:var(--pill);border:1px solid var(--stroke-2);color:var(--ink-3);white-space:nowrap;}
.ptag .pdd{width:6px;height:6px;border-radius:50%;background:var(--ink-4);}
.ptag-current{color:var(--signal);border-color:var(--signal);} .ptag-current .pdd{background:var(--signal);}
.ptag-past{color:var(--ink-3);} .ptag-past .pdd{background:var(--ink-4);}
.ptag-upcoming{color:var(--ink-3);border-style:dashed;} .ptag-upcoming .pdd{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-4);}
.ptag.mini{font-size:8.5px;padding:1px 6px;}

/* idea card link + brief tool */
.idea .m .lnk{margin-left:0;color:var(--ink-2);}
.idea .m .lnk:hover{color:var(--ink-1);}
.brief-pick{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.brief-pick select{flex:1;min-width:200px;background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r);color:var(--ink-1);font:inherit;font-size:14px;padding:9px 12px;}
.brief{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:14px;}
.brief-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.brief-head .bt{font-size:16px;color:var(--ink-1);flex:1;}
.brief-head .bx{background:none;border:none;color:var(--ink-4);cursor:pointer;font-size:12px;}
.brief-head .bx:hover{color:var(--signal);}
.brief-src{font-size:12px;color:var(--ink-3);margin-bottom:14px;padding-left:12px;border-left:2px solid var(--stroke-3);line-height:1.45;}
.bfield{margin-bottom:12px;}
.bfield label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:var(--fw-sb);color:var(--ink-3);margin-bottom:5px;}
.bfield textarea{width:100%;min-height:44px;resize:vertical;background:var(--warm);border:1px solid var(--stroke-1);border-radius:var(--r);color:var(--ink-1);font:inherit;font-size:13.5px;line-height:1.5;padding:9px 11px;}
.bfield textarea:focus{outline:none;border-color:var(--ink-1);}
.bfield textarea::placeholder{color:var(--ink-4);}
.brief-foot{display:flex;gap:10px;align-items:center;margin-top:6px;}
.brief-foot .hint{font-size:11px;color:var(--ink-4);margin-left:auto;}
.bt-in{flex:1;min-width:0;background:transparent;border:none;font:inherit;font-size:16px;color:var(--ink-1);padding:0;}
.bt-in:focus{outline:none;}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink-1);color:var(--paper);font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:var(--pill);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:400;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* password gate */
.gate{position:fixed;inset:0;z-index:500;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .25s var(--ease);}
.gate-card{width:100%;max-width:312px;text-align:center;}
.gate-logo{height:19px;width:auto;margin:0 auto;}
.gate-rule{width:34px;height:2px;background:var(--grad-ai);margin:22px auto 24px;border-radius:2px;}
.gate h2{font-size:20px;font-weight:var(--fw-reg);letter-spacing:-0.01em;margin:0 0 6px;}
.gate p{font-size:13px;color:var(--ink-3);margin:0 0 24px;line-height:1.5;}
.gate form{display:flex;flex-direction:column;gap:9px;}
.gate input{height:46px;background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r);color:var(--ink-1);font:inherit;font-size:16px;padding:0 16px;text-align:center;letter-spacing:.3em;transition:border-color var(--dur) var(--ease);}
.gate input::placeholder{letter-spacing:.14em;color:var(--ink-4);}
.gate input:focus{outline:none;border-color:var(--ink-1);}
.gate button{height:46px;background:var(--ink-1);color:var(--paper);border:none;border-radius:var(--pill);font:inherit;font-size:13.5px;font-weight:var(--fw-sb);cursor:pointer;transition:opacity var(--dur-fast) var(--ease);}
.gate button:hover{opacity:.9;}
.gate button:active{transform:scale(.99);}
.gate .err{font-size:12px;color:var(--signal);min-height:16px;margin-top:2px;}
.gate-hint{font-size:11px;color:var(--ink-4);margin-top:18px;letter-spacing:.02em;}

/* metric tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px;}
.tile{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r);padding:14px 16px;}

 });

}

/* ---------- task row ---------- */
function taskRow(t){
 var st=tstate(t.id);
 var tag=t.obj?'<span class="tagp"><span class="pd" style="background:'+OBJ_COLOR[t.obj]+'"></span>Obj '+t.obj+'</span>':'<span class="tagp">'+t.pillar+'</span>';
 var stcls="st st-"+st;
 var rm=t.custom?'<button class="rrm" data-rm="'+t.id+'" data-wk="'+t.wk+'" aria-label="Remove">×</button>':'';
 return '<div class="row" data-s="'+st+'" data-id="'+t.id+'">'
  +'<button class="dot" data-toggle="'+t.id+'" aria-label="Cycle status"></button>'
  +'<div class="rbody">'
   +'<div class="rtop">'+tag+'<span class="rtitle'+(t.custom?" mine":"")+'">'+t.text+'</span></div>'
   +(t.move?'<div class="rmv"><span class="a">→</span><span>'+t.move+'</span></div>':'')
   +'<div class="rfoot">'
     +'<span class="'+stcls+'"><span class="sd"></span>'+STATE_LABEL[st]+'</span>'
     +'<span class="it">'+(t.obj?"Obj "+t.obj+" · "+OBJ_NAME[t.obj]:"Orientation")+'</span>'
     +'<span class="it">'+t.pillar+'</span>'
     +rm
   +'</div>'
  +'</div></div>';
}

/* ---------- main views ---------- */
function viewTasksHTML(tasks,opts){
 opts=opts||{};
 var c=counts();
 var chips='<div class="chips">'
   +chip("all","All",c.total)
   +chip("open","Open",c.status.open)
   +chip("live","In progress",c.status.live)
   +chip("done","Done",c.status.done)
   +'</div>';
 var filtered=view.status==="all"?tasks:tasks.filter(function(t){return tstate(t.id)===view.status;});
 var body="";
 if(opts.groupByWeek){
   var byW={};filtered.forEach(function(t){(byW[t.wk]=byW[t.wk]||[]).push(t);});
   SEED.forEach(function(w){
     if(!byW[w.id])return;
     body+='<div class="wkdiv"><span class="num">'+w.num+'</span><span class="ti">'+w.title+'</span><span class="wkdiv-r">'+ptag(weekPhase(w))+'<span class="dt">'+w.dates+'</span></span></div>';
     body+='<div class="rows">'+byW[w.id].map(taskRow).join("")+'</div>';
   });
 }else{
   body='<div class="rows">'+filtered.map(taskRow).join("")+'</div>';
 }
 if(!filtered.length)body='<div class="rows"><div class="row" style="grid-template-columns:1fr;color:var(--ink-3);font-size:14px">Nothing here in this filter.</div></div>';
 return chips+body;
}
function chip(k,lab,n){return '<button class="chip'+(view.status===k?" on":"")+'" data-status="'+k+'">'+lab+'<span class="k tnum">'+n+'</span></button>';}

function strip(){
 var c=counts(),pct=c.total?Math.round(c.done/c.total*100):0,f=computeFocus();
 var fo;
 if(!f){fo='<span class="ovl">Proactive focus</span><p class="task">Every seeded move is complete.</p><p class="mv"><span>Add your own moves, or take the notes to Steven.</span></p>';}
 else{var wk=SEED.filter(function(w){return w.id===f.wk;})[0];var stl=tstate(f.id)==="live"?"in progress":"next up";
  fo='<span class="ovl">Proactive focus · '+stl+'</span><p class="task">'+f.text+'</p>'+(f.move?'<p class="mv"><span class="a">→</span><span>'+f.move+'</span></p>':'')+'<p class="m">'+wk.num+' · '+(f.obj?"Obj "+f.obj+" · "+OBJ_NAME[f.obj]:"Orientation")+'</p>';}
 var wbars=SEED.map(function(w){var wc=c.week[w.id],p=wc.total?wc.done/wc.total*100:0;return '<div class="wkbar"><span class="n">'+w.num.replace("Week ","W")+'</span><span class="t"><i style="width:'+p+'%"></i></span><span class="c tnum">'+wc.done+'/'+wc.total+'</span></div>';}).join("");
 return '<div class="strip"><div class="focus">'+fo+'</div><div class="prog"><div class="ring">'+ring(pct)+'<div><div class="pct tnum">'+pct+'%</div><div class="cnt tnum">'+c.done+' / '+c.total+' moves</div></div></div><div class="wk">'+wbars+'</div></div></div>';
}

 }else if(view.sec==="journal"){

/* ---------- daily log / journal ---------- */
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayKey(){return dkey(new Date());}
function logCountToday(){return ((state.log||{})[todayKey()]||[]).length;}
function addLog(text){text=(text||"").trim();if(!text)return;if(!state.log)state.log={};var k=todayKey();if(!state.log[k])state.log[k]=[];state.log[k].push({id:"l"+Date.now().toString(36),ts:Date.now(),text:text});save();render();}
function removeLog(date,id){if(state.log&&state.log[date]){state.log[date]=state.log[date].filter(function(x){return x.id!==id;});save();render();}}
function logMetrics(){
 var log=state.log||{},today=logCountToday(),week=0,now=new Date();
 for(var i=0;i<7;i++){var dd=new Date(now);dd.setDate(now.getDate()-i);week+=(log[dkey(dd)]||[]).length;}
 var streak=0;for(var j=0;;j++){var dj=new Date();dj.setDate(dj.getDate()-j);if((log[dkey(dj)]||[]).length>0)streak++;else break;}
 var days=Object.keys(log).filter(function(x){return log[x].length>0;}).length;
 return{today:today,week:week,streak:streak,days:days};
}
function tile(v,l){return '<div class="tile"><div class="tv tnum">'+v+'</div><div class="tl">'+l+'</div></div>';}
function journalHTML(){
 var k=todayKey(),entries=((state.log||{})[k]||[]).slice().sort(function(a,b){return b.ts-a.ts;}),m=logMetrics();
 var items=entries.length?entries.map(function(e){
   return '<div class="logentry"><span class="lt tnum">'+new Date(e.ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+'</span><span class="lx">'+escapeHTML(e.text)+'</span><button class="lrm" data-rmlog="'+e.id+'" data-logdate="'+k+'" aria-label="Delete">×</button></div>';
 }).join(""):'<div class="idea-empty">Nothing logged today yet. Check-ins fire at 12 · 3 · 6 · 11, Mon–Fri.</div>';
 return '<div class="mhead"><div><span class="ovl">Hub · Daily log</span><h1>What did you do?</h1><p class="sub">Dump it raw — broken is fine. It gets synthesised into a sharp, goal-anchored read across day, week, and month.</p></div></div>'
  +'<div class="tiles">'+tile(m.today,"Today")+tile(m.week,"Last 7 days")+tile(m.streak,"Day streak")+tile(m.days,"Days logged")+'</div>'
  +'<textarea class="ideabox" id="logbox" placeholder="What did you do since last check-in?  (⌘/Ctrl + Enter)"></textarea>'
  +'<div class="idea-actions"><button class="btn btn-pri" id="logadd">Log it</button><button class="btn btn-sec" id="logexport">Export log</button><span class="hint">'+k+'</span></div>'
  +'<div id="journal-slot"></div>'
  +'<div class="ovl" style="margin:26px 0 10px">Today</div><div class="loglist">'+items+'</div>';
}
function initJournal(){var b=document.getElementById("logbox");if(!b)return;b.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){addLog(b.value);b.value="";}});}
function exportLog(){var log=state.log||{},keys=Object.keys(log).filter(function(x){return log[x].length;}).sort();if(!keys.length){toast("Nothing to export");return;}var md=keys.map(function(k){return "## "+k+"\n"+log[k].slice().sort(function(a,b){return a.ts-b.ts;}).map(function(e){return "- ["+new Date(e.ts).toLocaleTimeString()+"] "+e.text;}).join("\n");}).join("\n\n")+"\n";copyText(md,"Log copied");}
function loadJournal(){var slot=document.getElementById("journal-slot");if(!slot)return;

function mdLite(md){
 var lines=md.replace(/\r/g,"").split("\n"),out=[],inList=false;
 function esc(s){return escapeHTML(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");}
 lines.forEach(function(ln){
   if(/^###\s/.test(ln)){if(inList){out.push("</ul>");inList=false;}out.push("<h4>"+esc(ln.replace(/^###\s/,""))+"</h4>");}
   else if(/^##\s/.test(ln)){if(inList){out.push("</ul>");inList=false;}out.push("<h3>"+esc(ln.replace(/^##\s/,""))+"</h3>");}
   else if(/^#\s/.test(ln)){if(inList){out.push("</ul>");inList=false;}out.push("<h2 class=\"mdh1\">"+esc(ln.replace(/^#\s/,""))+"</h2>");}
   else if(/^[-*]\s/.test(ln)){if(!inList){out.push("<ul>");inList=true;}out.push("<li>"+esc(ln.replace(/^[-*]\s/,""))+"</li>");}
   else if(ln.trim()===""){if(inList){out.push("</ul>");inList=false;}}
   else{if(inList){out.push("</ul>");inList=false;}out.push("<p>"+esc(ln)+"</p>");}
 });
 if(inList)out.push("</ul>");
 return out.join("");
}

/* ---------- passcode gate (soft: client-side; stores only a hash) ---------- */
var PASS_HASH="ef5d7e20e6fad25c73168f3200015c6cb551e0dfa34bcd04cca35bdcb1a0cbc5";
function sha256(ascii){
 function rr(v,a){return (v>>>a)|(v<<(32-a));}
 var mp=Math.pow,mw=mp(2,32),i,j,result="",words=[],bl=ascii.length*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};
 for(var cand=2;pc<64;cand++){if(!comp[cand]){for(i=0;i<313;i+=cand)comp[i]=cand;hash[pc]=(mp(cand,.5)*mw)|0;k[pc++]=(mp(cand,1/3)*mw)|0;}}
 ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return"";words[i>>2]|=j<<((3-i)%4)*8;}
 words[words.length]=(bl/mw)|0;words[words.length]=bl;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}
  for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:"")+b.toString(16);}
 return result;
}
